<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmland</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
            extend: {
                fontFamily: { sans: ['Lato', 'sans-serif'] },
                colors: { 'main-green': '#3a683a', 'main-yellow': '#f6a81c' }
            }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Lato', sans-serif; }
        .category-nav::-webkit-scrollbar { display: none; }
        .category-nav { -ms-overflow-style: none; scrollbar-width: none; }
        .category-nav > button + button::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 55%;
            width: 0;
            border-left: 2px dotted rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }
        #enquiryModal {
            background-color: rgba(21, 20, 20, 0.764) !important;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #enquiryModal.active {
            opacity: 1;
            visibility: visible;
        }
        #enquiryModal .modal-content {
            transform: translateY(20px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #enquiryModal.active .modal-content {
            transform: translateY(0) scale(1);
        }
    </style>
</head>
<body>
  <header class="site-header w-full bg-main-green text-white font-sans sticky top-0 z-50 shadow-md">
    <div class="max-w-[1400px] mx-auto px-4 md:px-6 flex items-center justify-between gap-4 min-h-[72px]">
        
        <a class="flex-shrink-0 flex items-center" href="index.html">
            <img src="assets/images/white_logo.svg" alt="Farmland Bazaar" class="h-12 w-auto object-contain">
        </a>

        <nav class="category-nav hidden md:flex flex-1 items-stretch justify-end overflow-x-auto pr-4 font-sans" aria-label="Property categories">
    
            <button class="group relative flex items-center justify-center px-6 py-2 transition-all duration-300 hover:bg-white/10 cursor-pointer text-white font-bold font-sans text-sm tracking-wide flex-shrink-0" onclick="window.location.href='project-listing.html?type=Farmland'">
                Farmland
            </button>

            <button class="group relative flex items-center justify-center px-6 py-2 transition-all duration-300 hover:bg-white/10 cursor-pointer text-white font-bold font-sans text-sm tracking-wide flex-shrink-0" onclick="window.location.href='project-listing.html?type=Farmhouse'">
                Farmhouse
            </button>

            <button class="group relative flex items-center justify-center px-6 py-2 transition-all duration-300 hover:bg-white/10 cursor-pointer text-white font-bold font-sans text-sm tracking-wide flex-shrink-0 hidden xl:flex" onclick="window.location.href='project-listing.html?type=Agricultural%20Land'">
                Agri Land
            </button>

            <button class="group relative flex items-center justify-center px-6 py-2 transition-all duration-300 hover:bg-white/10 cursor-pointer text-white font-bold font-sans text-sm tracking-wide flex-shrink-0 hidden xl:flex" onclick="window.location.href='project-listing.html?type=Estates'">
                Featured Properties
            </button>

        </nav>

        <div class="flex-shrink-0 flex items-center gap-2 md:pl-4">
            <button type="button" id="openEnquiryBtn" class="hidden md:flex group bg-white text-main-green font-bold text-sm pl-5 pr-6 py-2.5 rounded-full shadow-sm transition-all duration-300 items-center justify-center gap-2 hover:scale-105 hover:shadow-md hover:text-[#b07d35]">
                <svg class="w-4 h-4 transition-colors duration-300 group-hover:stroke-[#b07d35]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                </svg>
                Enquire Now
            </button>

            <button type="button" id="mobileMenuBtn" class="md:hidden bg-white/10 hover:bg-white/20 text-white p-3 rounded-full transition-colors" aria-label="Open Menu">
                <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </div>
</header>

<div id="mobileMenuOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[9998] opacity-0 invisible transition-opacity duration-300 md:hidden"></div>

<div id="mobileMenu" class="fixed top-0 right-0 h-full w-[80%] max-w-[320px] bg-[#ebf3ee] z-[9999] translate-x-full transition-transform duration-300 md:hidden flex flex-col shadow-2xl">
    <div class="flex items-center justify-between p-5 border-b border-gray-100">
        <img src="assets/images/logo_black.svg" alt="Logo" class="h-9">
        <button type="button" id="closeMobileMenuBtn" class="text-gray-600 p-2 hover:bg-gray-100 rounded-full transition-colors">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <div class="flex-grow overflow-y-auto py-4">
        <ul class="text-lg font-semibold text-gray-800 font-sans">
            <li><a href="index.html" class="block px-6 py-3 hover:bg-[#f4f9f6] hover:text-main-green transition-colors">Home</a></li>
            <li class="border-t border-gray-100 mt-2"><a href="project-listing.html?type=Farmland" class="block px-6 py-3 hover:bg-[#f4f9f6] hover:text-main-green transition-colors">Farmland</a></li>
            <li><a href="project-listing.html?type=Farmhouse" class="block px-6 py-3 hover:bg-[#f4f9f6] hover:text-main-green transition-colors">Farmhouse</a></li>
            <li><a href="project-listing.html?type=Agricultural%20Land" class="block px-6 py-3 hover:bg-[#f4f9f6] hover:text-main-green transition-colors">Agri Land</a></li>
            <li><a href="project-listing.html?type=Estates" class="block px-6 py-3 hover:bg-[#f4f9f6] hover:text-main-green transition-colors">Estate</a></li>
            <li><a href="about.html" class="block px-6 py-3 hover:bg-[#f4f9f6] hover:text-main-green transition-colors">About Us</a></li>
            <li><a href="contact.html" class="block px-6 py-3 hover:bg-[#f4f9f6] hover:text-main-green transition-colors">Contact Us</a></li>
           
        </ul>
    </div>
</div>

<!-- Enquiry Modal -->
<div id="enquiryModal" class="fixed inset-0 z-[100000] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="modal-content bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden relative">
        
        <!-- Close Button -->
        <button id="closeEnquiryBtn" type="button" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-full p-2 transition-colors z-10">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <!-- Modal Content -->
        <div class="p-6 md:p-8">
            <h3 class="text-2xl font-black text-gray-900 mb-2">Enquire Now</h3>
            <p class="text-sm text-gray-500 mb-6">Fill out the form below and our team will get back to you shortly.</p>

            <form action="#" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Full Name</label>
                    <input type="text" placeholder="John Doe" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:border-main-green focus:ring-1 focus:ring-main-green transition-colors text-sm">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Phone Number</label>
                    <input type="tel" placeholder="98765 43210" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:border-main-green focus:ring-1 focus:ring-main-green transition-colors text-sm">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Email Address</label>
                    <input type="email" placeholder="john@example.com" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:border-main-green focus:ring-1 focus:ring-main-green transition-colors text-sm">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Message</label>
                    <textarea rows="3" placeholder="I am interested in a Farmland....." class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:border-main-green focus:ring-1 focus:ring-main-green transition-colors text-sm"></textarea>
                </div>
                
                <button type="submit" class="w-full bg-main-green text-white font-bold py-3 rounded-xl hover:bg-[#2c502c] transition-colors shadow-md mt-2">
                    Submit Enquiry
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
