<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmland</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
            extend: {
                fontFamily: { sans: ['Lato', 'sans-serif'] },
                colors: { 'main-green': '#3a683a', 'main-yellow': '#f6a81c' }
            }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Lato', sans-serif; }
        .category-nav::-webkit-scrollbar { display: none; }
        .category-nav { -ms-overflow-style: none; scrollbar-width: none; }
        .category-nav > button + button::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 55%;
            width: 0;
            border-left: 2px dotted rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }
        #enquiryModal {
            background-color: rgba(21, 20, 20, 0.764) !important;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #enquiryModal.active {
            opacity: 1;
            visibility: visible;
        }
        #enquiryModal .modal-content {
            transform: translateY(20px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #enquiryModal.active .modal-content {
            transform: translateY(0) scale(1);
        }
    </style>
</head>
<body>
    <header class="site-header w-full bg-main-green text-white font-sans sticky top-0 z-50 shadow-md">
        <div class="max-w-[1400px] mx-auto px-4 md:px-6 flex items-center justify-between gap-4 min-h-[72px]">
            
            <a class="flex-shrink-0 flex items-center" href="index.html">
                <img src="assets/images/white_logo.svg" alt="Farmland Bazaar" class="h-12 w-auto object-contain">
            </a>

            <nav class="category-nav hidden md:flex flex-1 items-stretch justify-end overflow-x-auto pr-4" aria-label="Property categories">
                
                <button class="group relative flex items-center gap-3 px-5 py-3 transition-all duration-300 hover:bg-white/10 cursor-pointer text-left flex-shrink-0" onclick="window.location.href='project-listing.html?type=Farmland'">
                    <span class="flex items-center justify-center w-10 h-10 rounded-full bg-white text-main-green transition-all duration-300 group-hover:bg-white group-hover:text-main-green group-hover:scale-110">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>
                    </span>
                    <span class="flex flex-col min-w-0">
                        <span class="text-sm font-bold text-white leading-tight whitespace-nowrap">Farmland</span>
                        <span class="text-[11px] text-white/70 leading-tight whitespace-nowrap group-hover:text-white transition-colors">Find land to grow with</span>
                    </span>
                </button>

                <button class="group relative flex items-center gap-3 px-5 py-3 transition-all duration-300 hover:bg-white/10 cursor-pointer text-left flex-shrink-0" onclick="window.location.href='project-listing.html?type=Farmhouse'">
                    <span class="flex items-center justify-center w-10 h-10 rounded-full bg-white text-main-green transition-all duration-300 group-hover:bg-white group-hover:text-main-green group-hover:scale-110">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    </span>
                    <span class="flex flex-col min-w-0">
                        <span class="text-sm font-bold text-white leading-tight whitespace-nowrap">Farmhouse</span>
                        <span class="text-[11px] text-white/70 leading-tight whitespace-nowrap group-hover:text-white transition-colors">Discover your country home</span>
                    </span>
                </button>

                <button class="group relative flex items-center gap-3 px-5 py-3 transition-all duration-300 hover:bg-white/10 cursor-pointer text-left flex-shrink-0 hidden xl:flex" onclick="window.location.href='project-listing.html?type=Agricultural%20Land'">
                    <span class="flex items-center justify-center w-10 h-10 rounded-full bg-white text-main-green transition-all duration-300 group-hover:bg-white group-hover:text-main-green group-hover:scale-110">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
                    </span>
                    <span class="flex flex-col min-w-0">
                        <span class="text-sm font-bold text-white leading-tight whitespace-nowrap">Agri Land</span>
                        <span class="text-[11px] text-white/70 leading-tight whitespace-nowrap group-hover:text-white transition-colors">Explore agricultural plots</span>
                    </span>
                </button>

                <button class="group relative flex items-center gap-3 px-5 py-3 transition-all duration-300 hover:bg-white/10 cursor-pointer text-left flex-shrink-0 hidden xl:flex" onclick="window.location.href='project-listing.html?type=Estates'">
                    <span class="flex items-center justify-center w-10 h-10 rounded-full bg-white text-main-green transition-all duration-300 group-hover:bg-white group-hover:text-main-green group-hover:scale-110">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>
                    </span>
                    <span class="flex flex-col min-w-0">
                        <span class="text-sm font-bold text-white leading-tight whitespace-nowrap">Estates</span>
                        <span class="text-[11px] text-white/70 leading-tight whitespace-nowrap group-hover:text-white transition-colors">Browse premium properties</span>
                    </span>
                </button>

            </nav>

            <div class="flex-shrink-0 pl-4">
                <button type="button" id="openEnquiryBtn" class="group bg-white text-main-green font-bold text-sm pl-5 pr-6 py-2.5 rounded-full shadow-sm transition-all duration-300 flex items-center justify-center gap-2 hover:scale-105 hover:shadow-md hover:text-[#b07d35]">
                    <svg class="w-4 h-4 transition-colors duration-300 group-hover:stroke-[#b07d35]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>
                    Enquire Now
                </button>
            </div>
        </div>
    </header>

    <div id="enquiryModal" class="fixed inset-0 z-[99999] flex items-center justify-center p-4">
        <div class="modal-content bg-[#f9f9f9] rounded-[24px] shadow-2xl w-full max-w-[440px] relative" onclick="event.stopPropagation()">
            
            <div class="p-6 md:p-8">
                <div class="flex items-center justify-between mb-1">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full border border-main-green flex items-center justify-center text-main-green bg-white">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                        </div>
                        <h3 class="text-xl font-extrabold text-gray-900 uppercase tracking-tight">Get Free Callback</h3>
                    </div>
                </div>
                
                <p class="text-sm text-gray-700 mb-6 ml-1">Expert advisor will call you within 24 hours</p>

                <form action="#" method="POST" class="flex flex-col gap-3">
                    
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </span>
                        <input type="text" placeholder="Your full name" class="w-full pl-12 pr-4 py-3.5 rounded-xl border-2 border-gray-200 bg-white text-[15px] text-gray-800 placeholder-gray-500 focus:outline-none focus:border-[#3a683a] transition-colors" required>
                    </div>

                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                        </span>
                        <input type="tel" placeholder="Phone number" class="w-full pl-12 pr-4 py-3.5 rounded-xl border-2 border-gray-200 bg-white text-[15px] text-gray-800 placeholder-gray-500 focus:outline-none focus:border-[#3a683a] transition-colors" required>
                    </div>

                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        </span>
                        <input type="email" placeholder="Email address" class="w-full pl-12 pr-4 py-3.5 rounded-xl border-2 border-gray-200 bg-white text-[15px] text-gray-800 placeholder-gray-500 focus:outline-none focus:border-[#3a683a] transition-colors" required>
                    </div>

                    <div class="relative">
                        <span class="absolute left-4 top-4 text-gray-400">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                        </span>
                        <textarea rows="3" placeholder="Hi, I'm interested in Golden Grove by Aranyakaa Farms. Please share more details." class="w-full pl-12 pr-4 py-3.5 rounded-xl border-2 border-gray-200 bg-white text-[15px] text-gray-800 placeholder-gray-500 focus:outline-none focus:border-[#3a683a] transition-colors resize-none leading-relaxed"></textarea>
                    </div>

                    <button type="submit" class="mt-2 w-full bg-[#3a683a] hover:bg-[#2c502c] text-white font-bold text-[16px] py-4 rounded-xl flex items-center justify-center gap-2 transition-colors shadow-md">
                        <svg class="w-5 h-5 text-[#c49a45]" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        Send Enquiry
                    </button>
                </form>

                <div class="mt-5 flex items-center justify-center gap-2 text-[13px] text-gray-500 font-medium">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    Your information is 100% secure & private
                </div>
            </div>

            <button type="button" id="closeEnquiryBtn" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700 transition-colors p-2 z-10">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
    </div>
</body>
</html>
